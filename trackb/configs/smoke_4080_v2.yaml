# Re-smoke after GPU fixes found in smoke_4080_v1 (batched scoring/generation, merged inference LoRA,
# R3 sampling top_k fix, optional R2 class replay). Same 54 tiles / 20 steps; separate run and feedback dirs.
run_id: smoke_4080_v2
run_dir: outputs/smoke_4080_v2
manifest: data/manifest.csv
roles: data/roles.csv
data_root: data/raw
descriptors: configs/descriptors_crc.yaml
extra_manifest: null
seed: 0
model:
  name: Qwen/Qwen2-VL-2B-Instruct
  revision: main
  load_in_4bit: false
  gradient_checkpointing: true
  train_visual: []
  lora_r: 16
  lora_alpha: 32
  max_length: 1024
  min_pixels: 50176
  max_pixels: 50176
  generate_batch: 8
r2:
  class_replay_fraction: 0.5
train:
  steps: 20
  grad_accum: 1
  lr: 0.0001
  save_every: 10
  eval_every: 10
  dev_limit: 18
  sample_limit: 54
cache:
  batch_size: 16
  teachers:
  - conch
  - musk
  revisions:
    conch: main
    musk: main
  hard_fraction: 0.25
  threshold_candidates: [0.0, 0.01, 0.02, 0.04, 0.06, 0.08, 0.1, 0.15]
  minimum_dev_precision: 0.8
r3:
  rounds: 2
  candidates: 4
  max_tiles: 9
  max_per_tile: 2
  replay_fraction: 0.5
feedback:
  source: expert_label
  nodes:
  - 2
  - 4
  replay_fraction: 0.5

feedback_dir: data/feedback_smoke_v2
